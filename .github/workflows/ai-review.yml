name: AI Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build PR diff payload
        id: diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git diff --unified=3 "$BASE_SHA" "$HEAD_SHA" > pr.diff
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" > pr.files

          # Keep prompt size bounded for predictable token usage.
          MAX_DIFF_CHARS=12000
          MAX_FILES_CHARS=3000

          DIFF_CONTENT=$(cat pr.diff)
          FILES_CONTENT=$(cat pr.files)

          if [ ${#DIFF_CONTENT} -gt "$MAX_DIFF_CHARS" ]; then
            DIFF_CONTENT="${DIFF_CONTENT:0:$MAX_DIFF_CHARS}"
            DIFF_CONTENT="$DIFF_CONTENT"$'\n'"... [diff truncated]"
          fi

          if [ ${#FILES_CONTENT} -gt "$MAX_FILES_CHARS" ]; then
            FILES_CONTENT="${FILES_CONTENT:0:$MAX_FILES_CHARS}"
            FILES_CONTENT="$FILES_CONTENT"$'\n'"... [file list truncated]"
          fi

          {
            echo "files<<EOF"
            echo "$FILES_CONTENT"
            echo "EOF"
            echo "diff<<EOF"
            echo "$DIFF_CONTENT"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Run AI code review
        id: ai
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_FILES: ${{ steps.diff.outputs.files }}
          PR_DIFF: ${{ steps.diff.outputs.diff }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            {
              echo "review<<EOF"
              echo "AI review skipped: \`OPENAI_API_KEY\` is not configured."
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          MODEL="${OPENAI_MODEL:-gpt-4o-mini}"

          PROMPT=$(cat <<'EOF'
You are an autonomous pull request review agent.
Review the PR patch and list only actionable issues.

Output rules:
1) If there are no actionable findings, output exactly: lgtm
2) Otherwise, output:
   - First line: needs_changes
   - Then bullets with severity labels [high|medium|low], file path, and a short fix suggestion.
3) Do not include any text before the first line.
EOF
)

          INPUT_TEXT="$PROMPT

PR title: $PR_TITLE
PR number: #$PR_NUMBER

Changed files:
$PR_FILES

Patch:
$PR_DIFF"

          REQUEST_JSON=$(jq -n \
            --arg model "$MODEL" \
            --arg input "$INPUT_TEXT" \
            '{model: $model, input: $input}')

          RESPONSE_JSON=$(curl -sS https://api.openai.com/v1/responses \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $OPENAI_API_KEY" \
            -d "$REQUEST_JSON")

          REVIEW_TEXT=$(echo "$RESPONSE_JSON" | jq -r '
            if .error then
              "AI review failed: " + (.error.message // "unknown error")
            else
              (
                .output[]? | select(.type == "message") | .content[]? |
                select(.type == "output_text") | .text
              ) // "lgtm"
            end
          ')

          # If the model returns an empty first line, treat as no findings.
          if [ -z "$REVIEW_TEXT" ]; then
            REVIEW_TEXT="lgtm"
          fi

          {
            echo "review<<EOF"
            echo "$REVIEW_TEXT"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Find existing AI review comment
        id: find-comment
        uses: peter-evans/find-comment@v3
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: 'github-actions[bot]'
          body-includes: '<!-- ai-pr-review -->'

      - name: Create or update AI review comment
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          edit-mode: replace
          body: |
            <!-- ai-pr-review -->
            ## AI PR Review
            ${{ steps.ai.outputs.review }}
